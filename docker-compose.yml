version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devos-postgres
    environment:
      POSTGRES_USER: devos
      POSTGRES_PASSWORD: devos_secure_pwd_123
      POSTGRES_DB: devos_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: devos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
